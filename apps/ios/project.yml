name: Presently
options:
  bundleIdPrefix: tech.stygian
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G39TU2R26A
targets:
  Presently:
    type: application
    platform: iOS
    sources:
      - Presently
    info:
      path: Presently/Resources/Info.plist
      properties:
        CFBundleDisplayName: Presently
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: photo.presently.oauth
            CFBundleURLSchemes:
              - photo.presently.oauth
        LSApplicationCategoryType: public.app-category.photo-video
        NSCameraUsageDescription: Presently uses the camera to create the story you choose to post.
        NSPhotoLibraryAddUsageDescription: Presently saves a copy only when you enable Save to Photos.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.stygian.presently
    dependencies:
      - target: PresentlyControls
        embed: true
      - target: PresentlyCaptureExtension
        embed: true
    scheme:
      testTargets:
        - PresentlyTests
  PresentlyControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - PresentlyControls
      - path: Presently/SystemIntegration/PresentlyCaptureIntent.swift
        group: Presently/SystemIntegration
    info:
      path: PresentlyControls/Info.plist
      properties:
        CFBundleDisplayName: Presently Camera
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.stygian.presently.controls
        SKIP_INSTALL: "YES"
  PresentlyCaptureExtension:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - PresentlyCaptureExtension
      - path: Presently/SystemIntegration/PresentlyCaptureIntent.swift
        group: Presently/SystemIntegration
    info:
      path: PresentlyCaptureExtension/Info.plist
      properties:
        CFBundleDisplayName: Presently Camera
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.securecapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.stygian.presently.capture
        SKIP_INSTALL: "YES"
  PresentlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PresentlyTests
    dependencies:
      - target: Presently
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.stygian.presently.tests
        GENERATE_INFOPLIST_FILE: "YES"
