name: Presently
options:
  bundleIdPrefix: tech.stygian
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Presently:
    type: application
    platform: iOS
    sources:
      - Presently
    info:
      path: Presently/Resources/Info.plist
      properties:
        CFBundleDisplayName: Presently
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: tech.stygian.presently.oauth
            CFBundleURLSchemes:
              - tech.stygian.presently
        LSApplicationCategoryType: public.app-category.photo-video
        NSCameraUsageDescription: Presently uses the camera to create the story you choose to post.
        NSPhotoLibraryAddUsageDescription: Presently saves a copy only when you enable Save to Photos.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.stygian.presently
    scheme:
      testTargets:
        - PresentlyTests
  PresentlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PresentlyTests
    dependencies:
      - target: Presently
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.stygian.presently.tests
        GENERATE_INFOPLIST_FILE: "YES"
