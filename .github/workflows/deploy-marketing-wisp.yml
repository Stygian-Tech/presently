name: Deploy Marketing Site to Wisp

on:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - .github/workflows/deploy-marketing-wisp.yml
  workflow_dispatch:

concurrency:
  group: presently-marketing-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      PUBLIC_SITE_URL: ${{ vars.PRESENTLY_SITE_URL || 'https://presently.photo' }}
      WISP_HANDLE: ${{ vars.WISP_HANDLE }}
      WISP_SITE_NAME: ${{ vars.WISP_SITE_NAME || 'presently' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Astro project
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Validate Wisp credentials
        env:
          WISP_APP_PASSWORD: ${{ secrets.WISP_APP_PASSWORD }}
        run: |
          test -n "$WISP_HANDLE" || { echo "WISP_HANDLE is not configured"; exit 1; }
          test -n "$WISP_APP_PASSWORD" || { echo "WISP_APP_PASSWORD is not configured"; exit 1; }

      - name: Deploy to Wisp
        env:
          WISP_APP_PASSWORD: ${{ secrets.WISP_APP_PASSWORD }}
        run: >-
          npx --yes wispctl@1.2.0 deploy "$WISP_HANDLE"
          --path dist
          --site "$WISP_SITE_NAME"
          --password "$WISP_APP_PASSWORD"
          --yes
